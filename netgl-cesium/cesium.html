<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal - NetGL Cesium (guest)</title>
    <style>
      html, body, #cesium { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      /* Cesium's widgets.css normally supplies this; without it the canvas
         keeps its 300×150 intrinsic size and Cesium renders at that size. */
      #cesium .cesium-widget, #cesium canvas { width: 100%; height: 100%; display: block; }
      #credits { display: none; }
    </style>
    <!-- Relative so it resolves under any deploy base. Must be set before
         Cesium.js loads: Cesium reads it to find Workers/, Assets/, and
         ThirdParty/ at runtime. -->
    <script>window.CESIUM_BASE_URL = new URL('cesium/', document.baseURI).href</script>
    <script src="cesium/Cesium.js"></script>
    <script type="module" crossorigin src="/portal/netgl-cesium/assets/cesium-bJXBOh3a.js"></script>
    <link rel="modulepreload" crossorigin href="/portal/netgl-cesium/assets/protocol-DmfdGqC2.js">
  </head>
  <body>
    <div id="cesium"></div>
    <div id="credits"></div>
  </body>
</html>
