# fly.toml app configuration file generated for portal-snapshot-proxy on 2026-04-29T23:50:30-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'portal-snapshot-proxy'
primary_region = 'iad'

[build]
  dockerfile = 'apps/snapshot-proxy/Dockerfile'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  # Keep at least one machine running. Auto-stop made cold-start cost ~20 s
  # (container boot + jsdom + first gl context init), past social-media
  # crawler timeouts (~5–10 s) — preview previews failed silently. One
  # always-on shared-cpu-1x is ~$5/mo; surplus machines still auto-stop.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
