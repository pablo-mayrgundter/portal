<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spatial Portal - Host Three</title>

    <!-- Social preview. The og:image URL points at the snapshot-proxy's
         server-side renderer for the same scene this page renders client-side.
         Crawlers fetch a real PNG of the scene; JS-aware shares get an
         updated URL with the current ?pose= once the page boots. The proxy
         base URL is overridable via the meta tag below — change it for prod
         deploys without touching JS. -->
    <meta name="portal:snapshot-proxy" content="https://portal-snapshot-proxy.fly.dev" />
    <meta name="portal:snapshot-scene" content="pair" />
    <meta property="og:title" content="Spatial Portal — local two-world demo" />
    <meta property="og:description" content="Live 3D portal between two browser worlds. Walk through the door." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://portal-snapshot-proxy.fly.dev/render/pair?w=1200&h=630" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://portal-snapshot-proxy.fly.dev/render/pair?w=1200&h=630" />
    <style>
      html, body, #app {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #080b13;
      }
      .label {
        position: fixed;
        top: 12px;
        left: 12px;
        color: #d8e7ff;
        font-family: Inter, system-ui, sans-serif;
        font-size: 13px;
        line-height: 1.4;
        background: rgba(4, 9, 18, 0.65);
        border: 1px solid rgba(216, 231, 255, 0.2);
        border-radius: 8px;
        padding: 8px 10px;
        pointer-events: none;
      }
    </style>
    <script type="module" crossorigin src="/portal/assets/index-DbTRsGry.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <div class="label">
      WASD (or on-screen pad) + drag mouse/finger. Portal view is
      camera-coupled to your pose. Press <kbd>P</kbd> to copy a permalink
      for the current view.
    </div>
  </body>
</html>
