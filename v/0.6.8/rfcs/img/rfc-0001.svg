<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
<defs><marker id="arr-2a78d6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2a78d6"/></marker><marker id="arr-eb6834" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#eb6834"/></marker></defs>
<rect width="1200" height="900" fill="#fcfcfb"/>
<text x="40" y="52" font-size="28" fill="#0b0b0b" font-weight="700">RFC 0001 · Globe + orbit layers</text>
<text x="40" y="78" font-size="15" fill="#52514e">netmap's deck.gl globe hosts celestiary's orbits from another origin: an overlay, depth-tested against the globe, linked across engines.</text>
<rect x="1053.5" y="30" width="106.5" height="28" rx="14" fill="#e3eefb" stroke="#2a78d6" stroke-width="1"/>
<text x="1106.75" y="49" font-size="13" fill="#2a78d6" font-weight="700" text-anchor="middle">Draft · #39</text>
<rect x="40" y="100" width="580" height="270" rx="10" fill="#ffffff" stroke="#e3e2dd" stroke-width="1"/>
<rect x="40" y="100" width="580" height="4" rx="2" fill="#2a78d6"/>
<text x="58" y="132" font-size="16" fill="#0b0b0b" font-weight="700">The scenario</text>
<rect x="58" y="156" width="240" height="150" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1"/>
<text x="70" y="176" font-size="13.5" fill="#2a78d6" font-weight="700">netmap page (host)</text>
<text x="70" y="194" font-size="12.5" fill="#52514e">deck.gl GlobeView: the globe, AS</text>
<text x="70" y="210.25" font-size="12.5" fill="#52514e">nodes, arcs</text>
<text x="70" y="226.5" font-size="12.5" fill="#52514e">owns the clock and the camera</text>
<text x="70" y="242.75" font-size="12.5" fill="#52514e">attachNetGLDeckLayer replays</text>
<text x="70" y="259" font-size="12.5" fill="#52514e">after deck's draws, then</text>
<text x="70" y="275.25" font-size="12.5" fill="#52514e">popState()</text>
<text x="70" y="291.5" font-size="12.5" fill="#52514e">publishes asn:14593</text>
<rect x="362" y="156" width="240" height="150" rx="8" fill="#fdeae2" stroke="#eb6834" stroke-width="1"/>
<text x="374" y="176" font-size="13.5" fill="#eb6834" font-weight="700">celestiary iframe (guest)</text>
<text x="374" y="194" font-size="12.5" fill="#52514e">cross-origin, hidden,</text>
<text x="374" y="210.25" font-size="12.5" fill="#52514e">full-viewport</text>
<text x="374" y="226.5" font-size="12.5" fill="#52514e">three.js on a NetGL recorder</text>
<text x="374" y="242.75" font-size="12.5" fill="#52514e">satellites (SGP4), Starlink,</text>
<text x="374" y="259" font-size="12.5" fill="#52514e">Iridium, DSN links</text>
<text x="374" y="275.25" font-size="12.5" fill="#52514e">publishes norad:, dsn:, naif:</text>
<text x="374" y="291.5" font-size="12.5" fill="#52514e">anchors</text>
<line x1="300" y1="186" x2="360" y2="186" stroke="#2a78d6" stroke-width="2" marker-end="url(#arr-2a78d6)"/>
<text x="330" y="178" font-size="10.5" fill="#2a78d6" text-anchor="middle">layer:view</text>
<line x1="360" y1="231" x2="300" y2="231" stroke="#eb6834" stroke-width="2" marker-end="url(#arr-eb6834)"/>
<text x="330" y="223" font-size="10.5" fill="#eb6834" text-anchor="middle">netgl batch</text>
<line x1="360" y1="276" x2="300" y2="276" stroke="#eb6834" stroke-width="2" marker-end="url(#arr-eb6834)"/>
<text x="330" y="268" font-size="10.5" fill="#eb6834" text-anchor="middle">anchors</text>
<text x="58" y="332" font-size="12.5" fill="#52514e">The host sends pose, viewport and time; the guest sends one message a frame of</text>
<text x="58" y="348.875" font-size="12.5" fill="#52514e">WebGL2 calls, drawn in deck's clip space with no clears. The host draws the link</text>
<text x="58" y="365.75" font-size="12.5" fill="#52514e">AS14593 ↔ STARLINK-1007 itself, from both engines' anchors.</text>
<rect x="650" y="100" width="510" height="270" rx="10" fill="#ffffff" stroke="#e3e2dd" stroke-width="1"/>
<rect x="650" y="100" width="510" height="4" rx="2" fill="#1baf7a"/>
<text x="668" y="132" font-size="16" fill="#0b0b0b" font-weight="700">What it adds, and what's built</text>
<circle cx="675" cy="152" r="5.5" fill="#1baf7a" stroke="none"/>
<text x="688" y="156" font-size="12.5" fill="#0b0b0b" font-weight="700">Overlay kind</text>
<text x="688" y="171" font-size="11" fill="#52514e">0.5.0</text>
<circle cx="915" cy="152" r="5.5" fill="#1baf7a" stroke="none"/>
<text x="928" y="156" font-size="12.5" fill="#0b0b0b" font-weight="700">Shared depth, no clears</text>
<text x="928" y="171" font-size="11" fill="#52514e">0.4.0, 0.5.0</text>
<circle cx="675" cy="192" r="5.5" fill="#1baf7a" stroke="none"/>
<text x="688" y="196" font-size="12.5" fill="#0b0b0b" font-weight="700">Precise view (ECEF, doubles)</text>
<text x="688" y="211" font-size="11" fill="#52514e">Earth model; v2 in 0.7</text>
<circle cx="915" cy="192" r="5.5" fill="#1baf7a" stroke="none"/>
<text x="928" y="196" font-size="12.5" fill="#0b0b0b" font-weight="700">Extent and the far plane</text>
<text x="928" y="211" font-size="11" fill="#52514e">farZMultiplier; layer:extent next</text>
<circle cx="675" cy="232" r="5.5" fill="#eda100" stroke="none"/>
<text x="688" y="236" font-size="12.5" fill="#0b0b0b" font-weight="700">Time: timeMs in the view, layer:time</text>
<text x="688" y="251" font-size="11" fill="#52514e">split across #36 and #296</text>
<circle cx="915" cy="232" r="5.5" fill="#eda100" stroke="none"/>
<text x="928" y="236" font-size="12.5" fill="#0b0b0b" font-weight="700">Anchors, URI registry, links</text>
<text x="928" y="251" font-size="11" fill="#52514e">in apps; near-N (#304)</text>
<circle cx="675" cy="272" r="5.5" fill="#eda100" stroke="none"/>
<text x="688" y="276" font-size="12.5" fill="#0b0b0b" font-weight="700">Nesting flattened</text>
<text x="688" y="291" font-size="11" fill="#52514e">amended by RFC 0002</text>
<circle cx="915" cy="272" r="5.5" fill="#1baf7a" stroke="none"/>
<text x="928" y="276" font-size="12.5" fill="#0b0b0b" font-weight="700">Cross-origin: origin pinned</text>
<text x="928" y="291" font-size="11" fill="#52514e">nonce + port next</text>
<circle cx="675" cy="312" r="5.5" fill="#eda100" stroke="none"/>
<text x="688" y="316" font-size="12.5" fill="#0b0b0b" font-weight="700">Trust tiers</text>
<text x="688" y="331" font-size="11" fill="#52514e">trusted-origin checks, 0.8</text>
<circle cx="915" cy="312" r="5.5" fill="#1baf7a" stroke="none"/>
<text x="928" y="316" font-size="12.5" fill="#0b0b0b" font-weight="700">Host adapter: restore / invalidate</text>
<text x="928" y="331" font-size="11" fill="#52514e">luma, three, Cesium</text>
<circle cx="674" cy="358" r="5.5" fill="#1baf7a" stroke="none"/>
<text x="685" y="362" font-size="12" fill="#52514e">built and merged</text>
<circle cx="814.6" cy="358" r="5.5" fill="#eda100" stroke="none"/>
<text x="825.6" y="362" font-size="12" fill="#52514e">partial or next</text>
<circle cx="948.6" cy="358" r="5.5" fill="#6250d6" stroke="none"/>
<text x="959.6" y="362" font-size="12" fill="#52514e">open question</text>
<rect x="40" y="400" width="580" height="250" rx="10" fill="#ffffff" stroke="#e3e2dd" stroke-width="1"/>
<rect x="40" y="400" width="580" height="4" rx="2" fill="#eb6834"/>
<text x="58" y="432" font-size="16" fill="#0b0b0b" font-weight="700">What building it taught: the wire was the cost</text>
<rect x="58" y="456" width="266" height="76" rx="8" fill="#ffffff" stroke="#e3e2dd" stroke-width="1"/>
<rect x="58" y="466" width="4" height="56" rx="2" fill="#eb6834"/>
<text x="74" y="490" font-size="22" fill="#0b0b0b" font-weight="700">187 → 1</text>
<text x="74" y="510" font-size="11.5" fill="#52514e">messages per guest frame (wire 2: one</text>
<text x="74" y="524.95" font-size="11.5" fill="#52514e">batch over a MessagePort)</text>
<rect x="334" y="456" width="266" height="76" rx="8" fill="#ffffff" stroke="#e3e2dd" stroke-width="1"/>
<rect x="334" y="466" width="4" height="56" rx="2" fill="#eb6834"/>
<text x="350" y="490" font-size="22" fill="#0b0b0b" font-weight="700">505 → 48 KB</text>
<text x="350" y="510" font-size="11.5" fill="#52514e">per frame, uploads sliced to the bytes</text>
<text x="350" y="524.95" font-size="11.5" fill="#52514e">a call reads</text>
<rect x="58" y="540" width="266" height="76" rx="8" fill="#ffffff" stroke="#e3e2dd" stroke-width="1"/>
<rect x="58" y="550" width="4" height="56" rx="2" fill="#2a78d6"/>
<text x="74" y="574" font-size="22" fill="#0b0b0b" font-weight="700">210 → 0.1 ms</text>
<text x="74" y="594" font-size="11.5" fill="#52514e">host main-thread decode per frame</text>
<rect x="334" y="540" width="266" height="76" rx="8" fill="#ffffff" stroke="#e3e2dd" stroke-width="1"/>
<rect x="334" y="550" width="4" height="56" rx="2" fill="#2a78d6"/>
<text x="350" y="574" font-size="22" fill="#0b0b0b" font-weight="700">608 → 117 ms</text>
<text x="350" y="594" font-size="11.5" fill="#52514e">input to guest pixels shown (M2, 0.5.0</text>
<text x="350" y="608.95" font-size="11.5" fill="#52514e">→ 0.6.1)</text>
<text x="58" y="640" font-size="12.5" fill="#0b0b0b">Then: a late frame is corrected, not waited for (host reprojection, 0.6.3). What's</text>
<text x="58" y="656.875" font-size="12.5" fill="#0b0b0b">left is the host page's own frame rate.</text>
<rect x="650" y="400" width="510" height="250" rx="10" fill="#ffffff" stroke="#e3e2dd" stroke-width="1"/>
<rect x="650" y="400" width="510" height="4" rx="2" fill="#eda100"/>
<text x="668" y="432" font-size="16" fill="#0b0b0b" font-weight="700">Our take</text>
<circle cx="675" cy="452" r="5.5" fill="#1baf7a" stroke="none"/>
<text x="688" y="456" font-size="13" fill="#0b0b0b" font-weight="700">Accept</text>
<text x="688" y="473.55" font-size="12" fill="#52514e">the kind, shared depth, the view, time, anchors, the adapter semantics:</text>
<text x="688" y="489.75" font-size="12" fill="#52514e">build the rest as specified.</text>
<circle cx="675" cy="507.95" r="5.5" fill="#eda100" stroke="none"/>
<text x="688" y="511.95" font-size="13" fill="#0b0b0b" font-weight="700">Amend</text>
<text x="688" y="529.5" font-size="12" fill="#52514e">depth encoding's parameters per view; depth writes a per-host default;</text>
<text x="688" y="545.7" font-size="12" fill="#52514e">near-N required of big anchor publishers; flat through the middle on one</text>
<text x="688" y="561.9000000000001" font-size="12" fill="#52514e">page (RFC 0002).</text>
<circle cx="675" cy="580.1000000000001" r="5.5" fill="#6250d6" stroke="none"/>
<text x="688" y="584.1000000000001" font-size="13" fill="#0b0b0b" font-weight="700">Defer</text>
<text x="688" y="601.6500000000001" font-size="12" fill="#52514e">Web Mercator hosts get anchors only; untrusted guests go to isolated</text>
<text x="688" y="617.8500000000001" font-size="12" fill="#52514e">bitmaps, not validated GL; no propagation in the host.</text>
<rect x="40" y="680" width="1120" height="190" rx="10" fill="#ffffff" stroke="#e3e2dd" stroke-width="1"/>
<rect x="40" y="680" width="1120" height="4" rx="2" fill="#6250d6"/>
<text x="58" y="712" font-size="16" fill="#0b0b0b" font-weight="700">How to proceed</text>
<rect x="58" y="730" width="114.80000000000001" height="24" rx="12" fill="#ebe8fa" stroke="#6250d6" stroke-width="1"/>
<text x="115.4" y="746" font-size="12" fill="#6250d6" font-weight="700" text-anchor="middle">0.6.9–0.6.10</text>
<text x="58" y="776" font-size="12" fill="#52514e">RFC 0003's deferred deletes and named</text>
<text x="58" y="792.2" font-size="12" fill="#52514e">targets serve this guest too</text>
<rect x="336" y="730" width="100" height="24" rx="12" fill="#ebe8fa" stroke="#6250d6" stroke-width="1"/>
<text x="386" y="746" font-size="12" fill="#6250d6" font-weight="700" text-anchor="middle">0.7.0 · T3</text>
<text x="336" y="776" font-size="12" fill="#52514e">LayerView v2 as one type; #36 and #296</text>
<text x="336" y="792.2" font-size="12" fill="#52514e">on one envelope</text>
<rect x="614" y="730" width="100" height="24" rx="12" fill="#ebe8fa" stroke="#6250d6" stroke-width="1"/>
<text x="664" y="746" font-size="12" fill="#6250d6" font-weight="700" text-anchor="middle">0.8.0 · T5</text>
<text x="614" y="776" font-size="12" fill="#52514e">hello / hello-ack with nonce + port;</text>
<text x="614" y="792.2" font-size="12" fill="#52514e">trusted-origin checks; time and anchors</text>
<text x="614" y="808.4000000000001" font-size="12" fill="#52514e">with near-N; lifecycle; portal-layers</text>
<text x="614" y="824.6000000000001" font-size="12" fill="#52514e">0.1 cut</text>
<rect x="892" y="730" width="55.6" height="24" rx="12" fill="#ebe8fa" stroke="#6250d6" stroke-width="1"/>
<text x="919.8" y="746" font-size="12" fill="#6250d6" font-weight="700" text-anchor="middle">apps</text>
<text x="892" y="776" font-size="12" fill="#52514e">registry ids (dsn:GDSCC); DSN on</text>
<text x="892" y="792.2" font-size="12" fill="#52514e">view.earth; publish nothing before a</text>
<text x="892" y="808.4000000000001" font-size="12" fill="#52514e">subscription</text>
<text x="58" y="844" font-size="12.5" fill="#0b0b0b" font-weight="700">Open for comment:</text>
<text x="186" y="844" font-size="12.5" fill="#52514e">Q1 / Q16 / Q21 trust, and what makes untrusted GL safe · Q7 2D hosts · Q22 motion models · Q19 / Q20 depth step and the limb · Q5 Earth orientation</text>
<text x="40" y="882" font-size="11" fill="#8a8984">docs/rfcs/responses/0001-globe-orbit-layers.md · RFC text: docs/rfcs/0001-globe-orbit-layers.md · discussion: portal #39</text>
</svg>
