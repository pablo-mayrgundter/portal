<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal - iframe demo (host)</title>

    <!-- Social preview. og:image points at the snapshot-proxy's pair scene
         (worldA + worldB-through-portal — visually identical across the
         three demos). Crawlers without JS see the default-pose snapshot;
         JS-aware shares get an updated URL with the current ?pose=. -->
    <meta name="portal:snapshot-proxy" content="https://portal-snapshot-proxy.fly.dev" />
    <meta name="portal:snapshot-scene" content="pair" />
    <meta property="og:title" content="Spatial Portal — iframe destination" />
    <meta property="og:description" content="Live 3D portal with the destination world rendered by an iframe over postMessage." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://portal-snapshot-proxy.fly.dev/render/pair?w=1200&h=630" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://portal-snapshot-proxy.fly.dev/render/pair?w=1200&h=630" />
    <style>
      html, body, #app {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #080b13;
      }
      .label {
        position: fixed;
        top: 12px;
        left: 12px;
        color: #d8e7ff;
        font-family: Inter, system-ui, sans-serif;
        font-size: 13px;
        line-height: 1.4;
        background: rgba(4, 9, 18, 0.65);
        border: 1px solid rgba(216, 231, 255, 0.2);
        border-radius: 8px;
        padding: 8px 10px;
        pointer-events: none;
        max-width: 360px;
      }
      /* The iframe is logically present (it's the "remote world") but visually
         offscreen. The host composites its rendered frames onto the canvas. */
      #target-iframe {
        position: fixed;
        left: -10000px;
        top: -10000px;
        width: 1px;
        height: 1px;
        pointer-events: none;
        border: 0;
      }
      /* After portal traversal the iframe takes over as "here" — fill the
         viewport, take pointer events, and let the iframe's own canvas + its
         own controls drive the user. */
      #target-iframe.fullscreen {
        position: fixed;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        pointer-events: auto;
        z-index: 10;
      }
      /* Host canvas hidden once the iframe takes over. */
      body.handed-off #app { display: none; }
    </style>
    <script type="module" crossorigin src="/portal/v/0.4.0/iframe/assets/main-D0w8-5dj.js"></script>
    <link rel="modulepreload" crossorigin href="/portal/v/0.4.0/iframe/assets/index-r9B_6VzV.js">
  </head>
  <body>
    <div id="app"></div>
    <iframe id="target-iframe" src="target.html"></iframe>
    <div class="label">
      WASD (or on-screen pad) + drag mouse/finger. The portal shows a scene
      rendered by an iframe — pose mirrored across postMessage, color +
      packed-RGBA depth back, host clips against the destination plane.
    </div>
  
<!-- portal version banner: this is a snapshot rebuilt from 0e88bee (2026-10-23) -->
<style>
#portal-version-banner { position: fixed; left: 12px; bottom: 12px; z-index: 1002; display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 9px; background: rgba(8, 11, 19, 0.88); border: 1px solid rgba(154, 140, 255, 0.45); color: #d8e7ff; font: 12px/1.3 Inter, system-ui, sans-serif; box-shadow: 0 2px 12px rgba(0,0,0,.35); }
#portal-version-banner b { color: #c9bfff; font-weight: 600; }
#portal-version-banner select { font: 600 12px Inter, system-ui, sans-serif; color: #d8e7ff; background: rgba(154, 140, 255, 0.14); border: 1px solid rgba(154, 140, 255, 0.5); border-radius: 7px; padding: 3px 6px; cursor: pointer; }
#portal-version-banner a { color: #b7a9ff; text-decoration: underline; text-underline-offset: 2px; }
#portal-version-banner .pvb-note { color: #8fa7c4; }
@media (max-width: 600px) { #portal-version-banner .pvb-note { display: none; } }
</style>
<div id="portal-version-banner" role="region" aria-label="Site version">
  <b>portal-netgl 0.4.0</b>
  <span class="pvb-note">snapshot rebuilt from 0e88bee, 2026-10-23</span>
  <select id="portal-version-banner-select" aria-label="Other versions"><option value="" selected>versions…</option></select>
  <a id="portal-version-banner-docs" href="#" target="_blank" rel="noopener">docs ↗</a>
</div>
<script>
(function () {
  var path = location.pathname, m = path.match(/^(.*\/)v\/([^/]+)\/(.*)$/);
  if (!m) return;
  var siteRoot = m[1], here = m[2], rest = m[3];
  var sel = document.getElementById('portal-version-banner-select'), demosOf = {};
  document.getElementById('portal-version-banner-docs').href = siteRoot + 'rfcs/';
  fetch(siteRoot + 'v/versions.json', { cache: 'no-cache' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
    if (!j || !j.versions) return;
    var meta = j.meta || {};
    var add = function (value, text, selected) { var o = document.createElement('option'); o.value = value; o.textContent = text; o.selected = !!selected; sel.appendChild(o); };
    sel.innerHTML = '';
    add('latest', 'latest · ' + (j.latest || 'main'));
    j.versions.forEach(function (v) { var mm = meta[v] || {}; if (mm.demos) demosOf[v] = mm.demos; add(v, 'v' + v + (mm.date ? ' · ' + mm.date : '') + (mm.label ? ' · ' + mm.label : ''), v === here); });
    if (!meta[here] && j.versions.indexOf(here) < 0) add(here, 'v' + here, true);
  }).catch(function () {});
  sel.addEventListener('change', function () {
    var v = sel.value; if (!v) return;
    var target = v === 'latest' ? siteRoot : siteRoot + 'v/' + v + '/';
    // The same demo in the chosen version when it has it, else that version's root.
    var demo = rest.replace(/[^/]*$/, ''), key = demo.replace(/\/$/, '') || 'three';
    location.href = target + (demosOf[v] && demosOf[v].indexOf(key) < 0 ? '' : demo);
  });
})();
</script>
</body>
</html>
