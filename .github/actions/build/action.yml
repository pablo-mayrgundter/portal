name: Build portal demos
description: Build the demo apps with the given base path and assemble a single dist/ tree. host-three deploys at the root (it's the landing experience now, with a side-nav drawer to the other demos); host-iframe-demo / host-worker-demo / host-netgl-demo / host-netgl-celestiary live at /iframe/, /worker/, /netgl/, /netgl-celestiary/ siblings.

inputs:
  base-path:
    description: Base URL path with trailing slash, e.g. /portal/ or /portal/pr-preview/pr-17/. host-three is built directly under this base; the others get a /<name>/ subpath.
    required: true

runs:
  using: composite
  steps:
    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Build host-three (root)
      shell: bash
      run: npm run build -w @portal/host-three -- --base=${{ inputs.base-path }}

    - name: Build host-iframe-demo
      shell: bash
      run: npm run build -w @portal/host-iframe-demo -- --base=${{ inputs.base-path }}iframe/

    - name: Build host-worker-demo
      shell: bash
      run: npm run build -w @portal/host-worker-demo -- --base=${{ inputs.base-path }}worker/

    - name: Build host-netgl-demo
      shell: bash
      run: npm run build -w @portal/host-netgl-demo -- --base=${{ inputs.base-path }}netgl/

    - name: Build celestiary (with patches applied)
      shell: bash
      env:
        # celestiary's <base href> needs the full public prefix so its bundle
        # resolves under the GH Pages base path. apply.sh runs yarn build with
        # this BASE_PATH and copies docs/ into the host app's public/celestiary/.
        CELESTIARY_BASE_PATH: ${{ inputs.base-path }}netgl-celestiary/celestiary/
      run: npm run setup:celestiary

    - name: Build host-netgl-celestiary
      shell: bash
      run: npm run build -w @portal/host-netgl-celestiary -- --base=${{ inputs.base-path }}netgl-celestiary/

    - name: Assemble dist/
      shell: bash
      run: |
        rm -rf dist
        mkdir -p dist
        cp -r apps/host-three/dist/.              dist/
        cp -r apps/host-iframe-demo/dist          dist/iframe
        cp -r apps/host-worker-demo/dist          dist/worker
        cp -r apps/host-netgl-demo/dist           dist/netgl
        cp -r apps/host-netgl-celestiary/dist     dist/netgl-celestiary
