name: Deploy demos to GitHub Pages

# Build all demo apps under /portal/<demo>/, the overview page at /portal/
# and the RFC responses site at /portal/rfcs/. Deploys to the gh-pages branch
# with clean-exclude=pr-preview and v so that PR preview directories
# (managed by .github/workflows/pr-preview.yml) and the version snapshots
# survive main-branch deploys.
#
# Snapshots: the first deploy after portal-netgl's version changes builds
# the whole site a second time under /portal/v/<version>/ and keeps it
# there for good, so every release's demos and docs stay reachable.
# /portal/v/versions.json lists them; the version pulldown in the docs'
# header and the demos' drawer reads it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # netgl-celestiary's build pulls celestiary out of the external/
          # submodule; without this the checkout is just the pointer.
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: ./.github/actions/build
        with:
          base-path: /portal/

      - name: Find the snapshots that exist, and whether this version needs one
        id: versions
        run: |
          git fetch --depth=1 origin gh-pages || true
          VERSION=$(node -p "require('./packages/portal-netgl/package.json').version")
          EXISTING=$(git ls-tree --name-only origin/gh-pages v/ 2>/dev/null | sed 's#^v/##' | grep -E '^[0-9]' || true)
          NEW=true
          if echo "$EXISTING" | grep -qx "$VERSION"; then NEW=false; fi
          mkdir -p dist-versions
          # shellcheck disable=SC2086
          node scripts/write-versions.mjs "$VERSION" $EXISTING > dist-versions/versions.json
          cat dist-versions/versions.json
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
          clean-exclude: |
            pr-preview
            v

      - name: Publish the versions list
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist-versions
          branch: gh-pages
          target-folder: v
          clean: false

      - name: Build the snapshot for v/${{ steps.versions.outputs.version }}
        if: steps.versions.outputs.new == 'true'
        uses: ./.github/actions/build
        with:
          base-path: /portal/v/${{ steps.versions.outputs.version }}/

      - name: Deploy the snapshot
        if: steps.versions.outputs.new == 'true'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          target-folder: v/${{ steps.versions.outputs.version }}
          clean: false
