name: Deploy demos to GitHub Pages

# Build all demo apps under /portal/<demo>/ and a landing nav at /portal/.
# Deploys to the gh-pages branch with clean-exclude=pr-preview so that PR
# preview directories (managed by .github/workflows/pr-preview.yml) survive
# main-branch deploys.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # netgl-celestiary's build pulls celestiary out of the external/
          # submodule; without this the checkout is just the pointer.
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: ./.github/actions/build
        with:
          base-path: /portal/

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
          clean-exclude: |
            pr-preview
