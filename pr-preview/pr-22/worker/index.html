<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal - Web Worker demo</title>

    <!-- Social preview. og:image points at the snapshot-proxy's pair scene
         (worldA + worldB-through-portal — visually identical across the
         three demos). Crawlers without JS see the default-pose snapshot;
         JS-aware shares get an updated URL with the current ?pose=. -->
    <meta name="portal:snapshot-proxy" content="https://portal-snapshot-proxy.fly.dev" />
    <meta name="portal:snapshot-scene" content="pair" />
    <meta property="og:title" content="Spatial Portal — Web Worker destination" />
    <meta property="og:description" content="Live 3D portal with the destination world rendered by a Web Worker via OffscreenCanvas — no DOM." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://portal-snapshot-proxy.fly.dev/render/pair?w=1200&h=630" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://portal-snapshot-proxy.fly.dev/render/pair?w=1200&h=630" />
    <style>
      html, body, #app {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #080b13;
      }
      .label {
        position: fixed;
        top: 12px;
        left: 12px;
        color: #d8e7ff;
        font-family: Inter, system-ui, sans-serif;
        font-size: 13px;
        line-height: 1.4;
        background: rgba(4, 9, 18, 0.65);
        border: 1px solid rgba(216, 231, 255, 0.2);
        border-radius: 8px;
        padding: 8px 10px;
        pointer-events: none;
        max-width: 360px;
      }
    </style>
    <script type="module" crossorigin src="/portal/pr-preview/pr-22/worker/assets/index-COjlBchf.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <div class="label">
      WASD + drag mouse. The portal's destination is rendered by a Web
      Worker — no DOM, no iframe. Press <kbd>P</kbd> to copy a permalink for
      the current pose. Append <code>?pose=…</code> on either this demo or
      the iframe demo to land on the same view for an A/B comparison.
    </div>
  </body>
</html>
