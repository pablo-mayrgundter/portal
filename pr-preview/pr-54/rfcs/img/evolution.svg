<text x="40" y="52" font-size="28" fill="#0b0b0b" font-weight="700">How NetGL got here: the releases up to 0.6.9</text>
<text x="40" y="78" font-size="15" fill="#52514e">Read down a column: each release moved one or two of six axes, and the axes are the protocol. Every version is a snapshot of the site, demos included.</text>
