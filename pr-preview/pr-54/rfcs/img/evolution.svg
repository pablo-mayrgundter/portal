<text x="959" y="898" font-size="10.5" fill="#0b0b0b">part on the</text>
<text x="959" y="910.6" font-size="10.5" fill="#0b0b0b">frame-end</text>
<rect x="40" y="930" width="1180" height="52" fill="#f7f6f2"/>
<line x1="40" y1="982" x2="1220" y2="982" stroke="#e3e2dd" stroke-width="1"/>
<text x="48" y="949" font-size="12" fill="#6250d6" font-weight="700">v0.6.9  ·  2026-10-28</text>
<text x="48" y="965" font-size="10.5" fill="#52514e">Deferred deletes</text>
<circle cx="810" cy="946" r="4" fill="#e34948" stroke="none"/>
<text x="819" y="950" font-size="10.5" fill="#0b0b0b">deletes deferred:</text>
<text x="819" y="962.6" font-size="10.5" fill="#0b0b0b">any frame re-runs</text>
<text x="40" y="1018" font-size="12.5" fill="#0b0b0b">Three moves explain most of it: the seam moved down a layer (pixels → calls), then the unit moved up (a call → a frame); the guest's state became something the protocol carries</text>
<text x="40" y="1034.875" font-size="12.5" fill="#0b0b0b">(shadow → checkpoint → tracked → deferred); and the host's say over the guest's draws became a policy that grows a clause per integration.</text>
<text x="40" y="1072" font-size="12.5" fill="#52514e">Composition modes and lateness follow from the integrations: a door needs a door, an Earth needs a shape, orbits need neither, a city needs the host's pass; a guest on another</text>
<text x="40" y="1088.875" font-size="12.5" fill="#52514e">origin is a frame late, so the host corrects what it has.</text>
<text x="40" y="1114" font-size="11" fill="#8a8984">docs/rfcs/responses/evolution.md · snapshots at /portal/v/&lt;version&gt;/ · history.json names each version's commit</text>
</svg>
