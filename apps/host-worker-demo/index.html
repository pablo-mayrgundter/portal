<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal - Web Worker demo</title>
    <style>
      html, body, #app {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #080b13;
      }
      .label {
        position: fixed;
        top: 12px;
        left: 12px;
        color: #d8e7ff;
        font-family: Inter, system-ui, sans-serif;
        font-size: 13px;
        line-height: 1.4;
        background: rgba(4, 9, 18, 0.65);
        border: 1px solid rgba(216, 231, 255, 0.2);
        border-radius: 8px;
        padding: 8px 10px;
        pointer-events: none;
        max-width: 360px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="label">
      WASD + drag mouse. The portal's destination is rendered by a Web
      Worker — no DOM, no iframe. Press <kbd>P</kbd> to copy a permalink for
      the current pose. Append <code>?pose=…</code> on either this demo or
      the iframe demo to land on the same view for an A/B comparison.
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
