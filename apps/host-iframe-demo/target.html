<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal - iframe demo (target)</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1a0a14; color: #f7d6e0; font-family: system-ui, sans-serif; }
      .info { padding: 16px; max-width: 480px; }
      /* The display canvas is hidden until the iframe activates source mode
         (after a 'portal:traverse' message), at which point it covers the
         iframe's viewport and the .info text underneath becomes invisible. */
      #display { display: none; width: 100%; height: 100%; }
      body.source-mode #display { display: block; }
      body.source-mode .info { display: none; }
    </style>
  </head>
  <body>
    <div class="info">
      <h2>Iframe portal target</h2>
      <p>
        This page is the destination world for the iframe-portal demo. Open
        the host page (<a href="/">index.html</a>) to see it composited
        through a portal.
      </p>
      <p>
        After traversal it becomes the visible "here" — its display canvas
        takes over and WASD/mouse drive a camera in worldB.
      </p>
    </div>
    <canvas id="display"></canvas>
    <script type="module" src="/src/target.ts"></script>
  </body>
</html>
