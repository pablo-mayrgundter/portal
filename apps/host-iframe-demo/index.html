<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal - iframe demo (host)</title>
    <style>
      html, body, #app {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #080b13;
      }
      .label {
        position: fixed;
        top: 12px;
        left: 12px;
        color: #d8e7ff;
        font-family: Inter, system-ui, sans-serif;
        font-size: 13px;
        line-height: 1.4;
        background: rgba(4, 9, 18, 0.65);
        border: 1px solid rgba(216, 231, 255, 0.2);
        border-radius: 8px;
        padding: 8px 10px;
        pointer-events: none;
        max-width: 360px;
      }
      /* The iframe is logically present (it's the "remote world") but visually
         offscreen. The host composites its rendered frames onto the canvas. */
      #target-iframe {
        position: fixed;
        left: -10000px;
        top: -10000px;
        width: 1px;
        height: 1px;
        pointer-events: none;
        border: 0;
      }
      /* After portal traversal the iframe takes over as "here" — fill the
         viewport, take pointer events, and let the iframe's own canvas + its
         own controls drive the user. */
      #target-iframe.fullscreen {
        position: fixed;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        pointer-events: auto;
        z-index: 10;
      }
      /* Host canvas hidden once the iframe takes over. */
      body.handed-off #app { display: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <iframe id="target-iframe" src="/target.html"></iframe>
    <div class="label">
      WASD + drag mouse. The portal shows a scene rendered by an iframe — pose
      mirrored across postMessage, color + packed-RGBA depth back, host clips
      against the destination plane.
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
